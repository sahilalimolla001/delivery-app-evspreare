services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: quick_commerce_rider
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quick_commerce_rider"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/quick_commerce_rider
      JWT_SECRET: local-development-secret
      OTP_PROVIDER: dev
      ALLOWED_ORIGINS: http://localhost:8000,http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  postgres_data:
